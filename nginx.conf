server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /mobile {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /mobile/ {
        return 302 /mobile;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
